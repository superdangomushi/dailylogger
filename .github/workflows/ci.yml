# ビルドが通るかと、整形済みかを検証する CI。
# ジョブはどれも各コンポーネントの Makefile を呼ぶだけにして、
# 「ローカルで make build / make format-check が通れば CI も通る」状態を保つ。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチへ続けて push したときは古い実行を打ち切る。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: server (C++ ゲートウェイ + Node テスト)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      # server/Makefile の CPPFLAGS は ../client/cpp/third_party を参照するため、
      # client ディレクトリも一緒に checkout されている必要がある (同一リポジトリ)。
      - name: npm ci
        run: make npm-deps
        working-directory: server

      - name: build
        run: make build
        working-directory: server

      - name: test
        run: make test
        working-directory: server

  client:
    name: client (C++ 音声ワーカー)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Makefile の system-deps は sudo apt-get で g++ 等を入れるが、
      # ランナーには g++/make が既に入っているので不足分の OpenSSL ヘッダだけ入れる。
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: build
        run: make build
        working-directory: client

  format:
    name: format check (clang-format / Prettier / Black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # clang-format / Black は apt ではなく pip で入れる。
      # requirements-format.txt は make format-deps が読むのと同じファイルなので、
      # 手元で make format した結果と CI の判定が食い違わない。
      - name: install clang-format / Black
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-format.txt

      - name: install Prettier
        run: npm ci
        working-directory: server

      - name: server
        run: make format-check
        working-directory: server

      - name: client
        run: make format-check
        working-directory: client
